<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="SysToolChain in three steps. Batch: files in Cloud Storage go through PySpark on Dataproc into PostgreSQL, 144K+ player records. Stream: live World Cup YouTube comments flow through Kafka, which counts player mentions. Predict: a Random Forest halves the rating error, 0.97 RMSE against 1.94 for the linear baseline, with 0.98 R squared.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151a"/>
      <stop offset="1" stop-color="#0f1a24"/>
    </linearGradient>
    <clipPath id="feed"><rect x="177" y="96" width="126" height="106"/></clipPath>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lab{font-size:10.5px;font-weight:700;letter-spacing:1.4px}
      .cap{font-size:10.5px;fill:#cbd5e1}
      .st{animation:spot 12s linear infinite}
      .s2{animation-delay:-8s}
      .s3{animation-delay:-4s}
      @keyframes spot{0%{opacity:.4}4%,30%{opacity:1}36%,100%{opacity:.4}}
      .p{animation:down 1.8s linear infinite}
      .p2{animation-delay:-.6s}
      .p3{animation-delay:-1.2s}
      @keyframes down{0%{transform:translateY(0)}100%{transform:translateY(84px)}}
      .scroll{animation:up 8s linear infinite}
      @keyframes up{to{transform:translateY(-104px)}}
      .bar{transform-box:fill-box;transform-origin:left center;animation:grow 12s ease-out infinite}
      @keyframes grow{0%,64%{transform:scaleX(1)}66%{transform:scaleX(0)}76%,100%{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{display:none}}
    </style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>

  <text class="s" x="12" y="28" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7dd3fc">SYSTOOLCHAIN</text>
  <text class="s" x="12" y="48" font-size="14" fill="#e5e7eb">Football data, batch and live, feeding a player-rating model</text>

  <!-- 1 · BATCH -->
  <g class="st">
    <rect x="12" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="22" y="86" fill="#7dd3fc">1 · BATCH</text>
    <line x1="85" y1="110" x2="85" y2="194" stroke="#38bdf8" stroke-opacity=".35" stroke-width="2"/>
    <circle class="mv p" cx="85" cy="110" r="3" fill="#7dd3fc"/>
    <circle class="mv p p2" cx="85" cy="110" r="3" fill="#7dd3fc"/>
    <circle class="mv p p3" cx="85" cy="110" r="3" fill="#7dd3fc"/>
    <g fill="#0c2a3a" stroke="#38bdf8" stroke-opacity=".5">
      <rect x="22" y="98" width="126" height="24" rx="6"/>
      <rect x="22" y="140" width="126" height="24" rx="6"/>
      <rect x="22" y="182" width="126" height="24" rx="6"/>
    </g>
    <g class="s" font-size="10.5" fill="#e0f2fe" text-anchor="middle">
      <text x="85" y="114">Cloud Storage</text>
      <text x="85" y="156">PySpark · Dataproc</text>
      <text x="85" y="198">PostgreSQL (JDBC)</text>
    </g>
    <text class="s" x="85" y="248" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3fc">144K+</text>
    <text class="s cap" x="85" y="268" text-anchor="middle">player records</text>
  </g>

  <!-- 2 · STREAM -->
  <g class="st s2">
    <rect x="167" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="177" y="86" fill="#fcd34d">2 · STREAM</text>
    <g clip-path="url(#feed)">
      <g class="scroll s" font-size="10" fill="#e5e7eb">
        <rect x="177" y="98" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="112">kickoff in 5!</text>
        <rect x="177" y="124" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="138"><tspan fill="#fbbf24" font-weight="700">Player A</tspan>, what a goal</text>
        <rect x="177" y="150" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="164">who is the ref?</text>
        <rect x="177" y="176" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="190"><tspan fill="#fbbf24" font-weight="700">Player B</tspan> again!!</text>
        <rect x="177" y="202" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="216">kickoff in 5!</text>
        <rect x="177" y="228" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="242"><tspan fill="#fbbf24" font-weight="700">Player A</tspan>, what a goal</text>
        <rect x="177" y="254" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="268">who is the ref?</text>
        <rect x="177" y="280" width="126" height="20" rx="8" fill="#1e293b"/><text x="185" y="294"><tspan fill="#fbbf24" font-weight="700">Player B</tspan> again!!</text>
      </g>
    </g>
    <rect x="177" y="210" width="126" height="22" rx="6" fill="#422006" stroke="#fbbf24" stroke-opacity=".5"/>
    <text class="s" x="240" y="225" font-size="10.5" text-anchor="middle" fill="#fde68a">Kafka → mention counts</text>
    <text class="s cap" x="240" y="256" text-anchor="middle">live World Cup</text>
    <text class="s cap" x="240" y="270" text-anchor="middle">YouTube comments</text>
  </g>

  <!-- 3 · PREDICT -->
  <g class="st s3">
    <rect x="322" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="332" y="86" fill="#86efac">3 · PREDICT</text>
    <text class="s" x="332" y="106" font-size="10" fill="#94a3b8">rating error (RMSE)</text>
    <text class="s" x="332" y="126" font-size="10.5" fill="#e5e7eb">Linear baseline</text>
    <rect class="bar" x="332" y="132" width="122" height="16" rx="3" fill="#475569"/>
    <text class="m" x="449" y="144" font-size="10" text-anchor="end" fill="#f1f5f9">1.94</text>
    <text class="s" x="332" y="168" font-size="10.5" fill="#e5e7eb">Random Forest</text>
    <rect class="bar" x="332" y="174" width="61" height="16" rx="3" fill="#4ade80"/>
    <text class="m" x="399" y="186" font-size="10" fill="#bbf7d0">0.97</text>
    <text class="s" x="395" y="240" font-size="26" font-weight="700" text-anchor="middle" fill="#4ade80">0.98 R²</text>
    <text class="s cap" x="395" y="260" text-anchor="middle">error halved vs</text>
    <text class="s cap" x="395" y="274" text-anchor="middle">the linear baseline</text>
  </g>
</svg>
