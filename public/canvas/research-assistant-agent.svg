<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="RAG Research Assistant in three steps. Retrieve: a question goes to the Milvus vector store and the top documents come back. Reflect: the draft answer is checked claim by claim; a claim with no source is flagged and the agent drafts again. Grounded: only sourced claims are returned, with citations, giving 80% fewer hallucinations.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0b1f"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lab{font-size:10.5px;font-weight:700;letter-spacing:1.4px}
      .cap{font-size:10.5px;fill:#cbd5e1}
      .st{animation:spot 12s linear infinite}
      .s2{animation-delay:-8s}
      .s3{animation-delay:-4s}
      @keyframes spot{0%{opacity:.4}4%,30%{opacity:1}36%,100%{opacity:.4}}
      .d1,.d2,.d3{animation:chip 4s ease-out infinite}
      .d2{animation-delay:.25s}
      .d3{animation-delay:.5s}
      @keyframes chip{0%{opacity:0;transform:translateY(-6px)}12%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
      .flag{animation:flag 1.4s ease-in-out infinite}
      @keyframes flag{0%,100%{fill-opacity:.35}50%{fill-opacity:.12}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .dot{animation:rise 1.6s linear infinite}
      .dot2{animation-delay:-.8s}
      @keyframes rise{0%{transform:translateY(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{display:none}}
    </style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>

  <text class="s" x="12" y="28" font-size="11" font-weight="700" letter-spacing="2.2" fill="#c4b5fd">RAG RESEARCH ASSISTANT</text>
  <text class="s" x="12" y="48" font-size="14" fill="#e5e7eb">Checks its own answer against its sources before replying</text>

  <!-- 1 · RETRIEVE -->
  <g class="st">
    <rect x="12" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="22" y="86" fill="#c4b5fd">1 · RETRIEVE</text>
    <rect x="22" y="96" width="126" height="36" rx="6" fill="#1e293b"/>
    <text class="m" font-size="10" fill="#e5e7eb"><tspan x="30" y="110">Q: When did the</tspan><tspan x="30" y="124">Transformer appear?</tspan></text>
    <circle class="mv dot" cx="85" cy="156" r="2.5" fill="#a78bfa"/>
    <circle class="mv dot dot2" cx="85" cy="156" r="2.5" fill="#a78bfa"/>
    <g fill="#2e1065" stroke="#a78bfa" stroke-opacity=".7">
      <path d="M59 152 v24 a26 7 0 0 0 52 0 v-24"/>
      <ellipse cx="85" cy="152" rx="26" ry="7"/>
    </g>
    <text class="s" x="85" y="173" font-size="10" text-anchor="middle" fill="#ddd6fe">Milvus</text>
    <g class="m" font-size="9.5" fill="#e5e7eb">
      <g class="d1"><rect x="22" y="192" width="126" height="18" rx="5" fill="#1e1b4b"/><text x="30" y="204">[1] paper · 2017</text></g>
      <g class="d2"><rect x="22" y="214" width="126" height="18" rx="5" fill="#1e1b4b"/><text x="30" y="226">[2] survey</text></g>
      <g class="d3"><rect x="22" y="236" width="126" height="18" rx="5" fill="#1e1b4b"/><text x="30" y="248">[3] lecture notes</text></g>
    </g>
    <text class="s cap" x="85" y="274" text-anchor="middle">top documents</text>
  </g>

  <!-- 2 · REFLECT -->
  <g class="st s2">
    <rect x="167" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="177" y="86" fill="#fcd34d">2 · REFLECT</text>
    <rect x="177" y="96" width="126" height="86" rx="6" fill="#1e293b"/>
    <text class="s" x="185" y="110" font-size="9.5" fill="#94a3b8">DRAFT</text>
    <text class="m" font-size="10" fill="#e5e7eb"><tspan x="185" y="126">Introduced in</tspan><tspan x="185" y="140">2017 [1]</tspan></text>
    <text class="s" x="295" y="140" font-size="11" text-anchor="end" fill="#4ade80">✓</text>
    <rect class="flag" x="181" y="148" width="118" height="30" rx="4" fill="#fbbf24" fill-opacity=".3"/>
    <text class="m" font-size="10"><tspan x="185" y="160" fill="#fde68a">Replaced all RNNs</tspan><tspan x="185" y="173" fill="#fbbf24">no source ✗</tspan></text>
    <g class="spin" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round">
      <path d="M216 214 a14 14 0 1 1 -10 -13.4"/>
      <path d="M201 196 l5 4.6 -6 3"/>
    </g>
    <text class="s" font-size="10.5" fill="#fde68a"><tspan x="240" y="210">drop it,</tspan><tspan x="240" y="224">draft again</tspan></text>
    <text class="s cap" x="240" y="262" text-anchor="middle">is every claim</text>
    <text class="s cap" x="240" y="276" text-anchor="middle">in the documents?</text>
  </g>

  <!-- 3 · GROUNDED -->
  <g class="st s3">
    <rect x="322" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="332" y="86" fill="#86efac">3 · GROUNDED</text>
    <rect x="332" y="96" width="126" height="54" rx="6" fill="#052e16" stroke="#4ade80" stroke-opacity=".45"/>
    <text class="s" x="340" y="110" font-size="9.5" fill="#86efac">ANSWER</text>
    <text class="m" font-size="10" fill="#e5e7eb"><tspan x="340" y="126">Introduced in</tspan><tspan x="340" y="140">2017 [1]</tspan></text>
    <text class="s" x="450" y="140" font-size="11" text-anchor="end" fill="#4ade80">✓</text>
    <rect x="332" y="158" width="126" height="18" rx="5" fill="none" stroke="#4ade80" stroke-opacity=".45"/>
    <text class="m" x="340" y="170" font-size="9.5" fill="#bbf7d0">source: [1] paper</text>
    <text class="s" x="395" y="228" font-size="30" font-weight="700" text-anchor="middle" fill="#4ade80">80%</text>
    <text class="s cap" x="395" y="248" text-anchor="middle">fewer hallucinations</text>
    <text class="s" x="395" y="274" font-size="9.5" text-anchor="middle" fill="#64748b">LangGraph · Milvus · GKE</text>
  </g>
</svg>
