<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Vector Guard in three steps. Attack: 2 of 5 retrieved documents are poisoned and the answer comes out wrong, 59% attack success. Four checks: structure, embedding, NLI contradiction and LLM score; poisoned documents stop at a check, clean ones pass. Defended: poisoned documents removed, the answer is right, 3% attack success.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .lab{font-size:10.5px;font-weight:700;letter-spacing:1.4px}
      .cap{font-size:10.5px;fill:#cbd5e1}
      .st{animation:spot 12s linear infinite}
      .s2{animation-delay:-8s}
      .s3{animation-delay:-4s}
      @keyframes spot{0%{opacity:.4}4%,30%{opacity:1}36%,100%{opacity:.4}}
      .pz{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
      .g1{animation:pass 3s linear infinite}
      .g2{animation:pass 3s linear infinite;animation-delay:-1.5s}
      @keyframes pass{0%{transform:translateY(0);opacity:0}8%,85%{opacity:1}100%{transform:translateY(114px);opacity:0}}
      .r1{animation:stop1 3s ease-out infinite;animation-delay:-.7s}
      @keyframes stop1{0%{transform:translateY(0);opacity:0}8%{opacity:1}25%{transform:translateY(16px);opacity:1}30%{opacity:1;r:6.5px}45%,100%{transform:translateY(16px);opacity:0}}
      .r2{animation:stop3 3s ease-out infinite;animation-delay:-2.2s}
      @keyframes stop3{0%{transform:translateY(0);opacity:0}8%{opacity:1}55%{transform:translateY(68px);opacity:1}60%{opacity:1;r:6.5px}75%,100%{transform:translateY(68px);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{display:none}}
    </style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>

  <text class="s" x="12" y="28" font-size="11" font-weight="700" letter-spacing="2.2" fill="#5eead4">VECTOR GUARD</text>
  <text class="s" x="12" y="48" font-size="14" fill="#e5e7eb">Checks every retrieved document before the model reads it</text>

  <!-- 1 · ATTACK -->
  <g class="st">
    <rect x="12" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="22" y="86" fill="#fca5a5">1 · ATTACK</text>
    <rect x="22" y="96" width="126" height="22" rx="6" fill="#1e293b"/>
    <text class="m" x="30" y="111" font-size="10.5" fill="#e5e7eb">Q: CVE severity?</text>
    <g>
      <rect x="22" y="128" width="20" height="26" rx="3" fill="#334155"/>
      <rect x="48.5" y="128" width="20" height="26" rx="3" fill="#7f1d1d" stroke="#f87171" class="pz"/>
      <rect x="75" y="128" width="20" height="26" rx="3" fill="#334155"/>
      <rect x="101.5" y="128" width="20" height="26" rx="3" fill="#7f1d1d" stroke="#f87171" class="pz"/>
      <rect x="128" y="128" width="20" height="26" rx="3" fill="#334155"/>
      <g fill="#64748b">
        <rect x="26" y="135" width="12" height="2"/><rect x="26" y="141" width="8" height="2"/>
        <rect x="79" y="135" width="12" height="2"/><rect x="79" y="141" width="8" height="2"/>
        <rect x="132" y="135" width="12" height="2"/><rect x="132" y="141" width="8" height="2"/>
      </g>
      <g fill="#fca5a5">
        <rect x="52.5" y="135" width="12" height="2"/><rect x="52.5" y="141" width="8" height="2"/>
        <rect x="105.5" y="135" width="12" height="2"/><rect x="105.5" y="141" width="8" height="2"/>
      </g>
    </g>
    <text class="s" x="85" y="170" font-size="10" text-anchor="middle" fill="#94a3b8">2 of 5 docs poisoned</text>
    <rect x="22" y="180" width="126" height="22" rx="6" fill="#3f1212" stroke="#f87171" stroke-opacity=".45"/>
    <text class="m" x="30" y="195" font-size="10.5" fill="#fecaca">A: Low</text>
    <text class="s" x="140" y="195" font-size="11" text-anchor="end" fill="#f87171">✗ wrong</text>
    <text class="s" x="85" y="248" font-size="30" font-weight="700" text-anchor="middle" fill="#f87171">59%</text>
    <text class="s cap" x="85" y="268" text-anchor="middle">attack success</text>
  </g>

  <!-- 2 · FOUR CHECKS -->
  <g class="st s2">
    <rect x="167" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="177" y="86" fill="#5eead4">2 · FOUR CHECKS</text>
    <g fill="#0f2a2a" stroke="#2dd4bf" stroke-opacity=".35">
      <rect x="177" y="98" width="126" height="20" rx="5"/>
      <rect x="177" y="124" width="126" height="20" rx="5"/>
      <rect x="177" y="150" width="126" height="20" rx="5"/>
      <rect x="177" y="176" width="126" height="20" rx="5"/>
    </g>
    <g class="s" font-size="10.5" fill="#ccfbf1">
      <text x="185" y="112">Structure</text>
      <text x="185" y="138">Embedding</text>
      <text x="185" y="164">NLI contradiction</text>
      <text x="185" y="190">LLM score</text>
    </g>
    <circle class="mv g1" cx="293" cy="92" r="4.5" fill="#4ade80"/>
    <circle class="mv g2" cx="293" cy="92" r="4.5" fill="#4ade80"/>
    <circle class="mv r1" cx="293" cy="92" r="4.5" fill="#f87171"/>
    <circle class="mv r2" cx="293" cy="92" r="4.5" fill="#f87171"/>
    <text class="s cap" x="240" y="228" text-anchor="middle">cheap checks first,</text>
    <text class="s cap" x="240" y="243" text-anchor="middle">slower checks last</text>
    <text class="s" x="240" y="268" font-size="10" text-anchor="middle" fill="#64748b">1,063 CVE + ATT&amp;CK docs</text>
  </g>

  <!-- 3 · DEFENDED -->
  <g class="st s3">
    <rect x="322" y="66" width="146" height="222" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="s lab" x="332" y="86" fill="#86efac">3 · DEFENDED</text>
    <rect x="332" y="96" width="126" height="22" rx="6" fill="#1e293b"/>
    <text class="m" x="340" y="111" font-size="10.5" fill="#e5e7eb">Q: CVE severity?</text>
    <g>
      <rect x="332" y="128" width="20" height="26" rx="3" fill="#334155" stroke="#4ade80" stroke-opacity=".6"/>
      <rect x="358.5" y="128.5" width="20" height="25" rx="3" fill="none" stroke="#f87171" stroke-opacity=".4" stroke-dasharray="3 2"/>
      <rect x="385" y="128" width="20" height="26" rx="3" fill="#334155" stroke="#4ade80" stroke-opacity=".6"/>
      <rect x="411.5" y="128.5" width="20" height="25" rx="3" fill="none" stroke="#f87171" stroke-opacity=".4" stroke-dasharray="3 2"/>
      <rect x="438" y="128" width="20" height="26" rx="3" fill="#334155" stroke="#4ade80" stroke-opacity=".6"/>
      <g fill="#64748b">
        <rect x="336" y="135" width="12" height="2"/><rect x="336" y="141" width="8" height="2"/>
        <rect x="389" y="135" width="12" height="2"/><rect x="389" y="141" width="8" height="2"/>
        <rect x="442" y="135" width="12" height="2"/><rect x="442" y="141" width="8" height="2"/>
      </g>
      <g class="s" font-size="12" fill="#f87171" fill-opacity=".7" text-anchor="middle">
        <text x="368.5" y="145">×</text><text x="421.5" y="145">×</text>
      </g>
    </g>
    <text class="s" x="395" y="170" font-size="10" text-anchor="middle" fill="#94a3b8">poisoned docs removed</text>
    <rect x="332" y="180" width="126" height="22" rx="6" fill="#052e16" stroke="#4ade80" stroke-opacity=".45"/>
    <text class="m" x="340" y="195" font-size="10.5" fill="#bbf7d0">A: Critical</text>
    <text class="s" x="450" y="195" font-size="11" text-anchor="end" fill="#4ade80">✓</text>
    <text class="s" x="395" y="248" font-size="30" font-weight="700" text-anchor="middle" fill="#4ade80">3%</text>
    <text class="s cap" x="395" y="268" text-anchor="middle">attack success</text>
  </g>
</svg>
